<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Rouge</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <a href="index.html" class="logo">Rouge</a>
    <nav>
        <a href="receitas.html">Receitas</a>
        <a href="ebook.html">Ebook</a>
        <a href="sobre.html">Sobre</a>
        <a href="faq.html">FAQ</a>
        <a href="contacto.html">Contacto</a>
    </nav>
    <button class="login-btn" onclick="window.location.href='login.html'">Entrar</button>
    <button class="hamburger" id="hamburger" aria-label="Abrir menu">
        <span></span><span></span><span></span>
    </button>
</header>

<div class="mobile-menu" id="mobileMenu">
    <a href="receitas.html">Receitas</a>
    <a href="ebook.html">Ebook</a>
    <a href="sobre.html">Sobre</a>
    <a href="faq.html">FAQ</a>
    <a href="contacto.html">Contacto</a>
    <button class="login-btn-mobile" onclick="window.location.href='login.html'">Entrar</button>
</div>

<section class="section page-section">
    <div class="auth-wrap">
        <div class="auth-box">
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="btn-tab-login" onclick="switchTab('login')">Entrar</button>
                <button type="button" class="auth-tab" id="btn-tab-register" onclick="switchTab('register')">Criar conta</button>
            </div>
            <div id="tab-login">
                <h3 class="auth-title">Bem-vindo de volta</h3>
                <form onsubmit="fazerLogin(event)">
                    <input type="email" placeholder="Email" required autocomplete="email">
                    <input type="password" placeholder="Palavra-passe" required autocomplete="current-password">
                    <button type="submit">Entrar</button>
                </form>
                <p class="auth-link">Não tens conta? <a onclick="switchTab('register')">Criar conta</a></p>
            </div>
            <div id="tab-register" style="display:none">
                <h3 class="auth-title">Criar conta</h3>
                <form onsubmit="fazerRegisto(event)">
                    <input type="text" placeholder="Nome" required autocomplete="name">
                    <input type="email" placeholder="Email" required autocomplete="email">
                    <input type="password" placeholder="Palavra-passe" required minlength="6" autocomplete="new-password">
                    <input type="password" placeholder="Confirmar palavra-passe" required minlength="6" autocomplete="new-password">
                    <button type="submit">Criar conta</button>
                </form>
                <p class="auth-link">Já tens conta? <a onclick="switchTab('login')">Entrar</a></p>
            </div>
        </div>
    </div>
</section>

<script src="menu.js"></script>
<script src="auth.js"></script>
</body>
</html>
