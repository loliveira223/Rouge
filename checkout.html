<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Rouge</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <a href="index.html" class="logo">Rouge</a>
    <nav>
        <a href="receitas.html">Receitas</a>
        <a href="ebook.html" class="active">Ebook</a>
        <a href="sobre.html">Sobre</a>
        <a href="faq.html">FAQ</a>
        <a href="contacto.html">Contacto</a>
    </nav>
    <button class="login-btn" onclick="window.location.href='login.html'">Entrar</button>
    <button class="hamburger" id="hamburger" aria-label="Abrir menu">
        <span></span><span></span><span></span>
    </button>
</header>

<div class="mobile-menu" id="mobileMenu">
    <a href="receitas.html">Receitas</a>
    <a href="ebook.html" class="active">Ebook</a>
    <a href="sobre.html">Sobre</a>
    <a href="faq.html">FAQ</a>
    <a href="contacto.html">Contacto</a>
    <button class="login-btn-mobile" onclick="window.location.href='login.html'">Entrar</button>
</div>

<section class="section page-section">
    <a href="ebook.html" class="back-link-dark">← Voltar ao Ebook</a>
    <div class="checkout-layout">
        <div class="checkout-resumo">
            <h3>Resumo da encomenda</h3>
            <div class="checkout-item">
                <div>
                    <p class="checkout-item-nome">Ebook Mesa Lenta</p>
                    <p class="checkout-item-desc">PDF + ePub · Download imediato</p>
                </div>
                <span class="checkout-item-preco">12€</span>
            </div>
            <div class="checkout-total">
                <span>Total</span>
                <span>12€</span>
            </div>
            <div class="checkout-seguro">🔒 Pagamento 100% seguro</div>
        </div>
        <div class="checkout-form-box">
            <h3>Dados de pagamento</h3>
            <form onsubmit="finalizarCompra(event)">
                <input type="text" placeholder="Nome completo" required autocomplete="name">
                <input type="email" placeholder="Email (para receber o ebook)" required autocomplete="email">
                <label class="checkout-label" for="cartao">Cartão de crédito / débito</label>
                <input type="text" id="cartao" placeholder="1234 5678 9012 3456" inputmode="numeric" maxlength="19" pattern="[0-9 ]{19}" required autocomplete="cc-number">
                <div class="checkout-row">
                    <input type="text" id="validade" placeholder="MM/AA" inputmode="numeric" maxlength="5" pattern="(0[1-9]|1[0-2])/[0-9]{2}" required autocomplete="cc-exp">
                    <input type="text" id="cvv" placeholder="CVV" inputmode="numeric" maxlength="3" pattern="[0-9]{3}" required autocomplete="cc-csc">
                </div>
                <button type="submit" class="ebook-btn-comprar">FINALIZAR COMPRA · 12€</button>
            </form>
            <p class="ebook-seguro" style="text-align:center;margin-top:12px;">Pagamento seguro · Download imediato após pagamento</p>
        </div>
    </div>
</section>

<script src="menu.js"></script>
<script src="checkout.js"></script>
</body>
</html>
